interface:
  display_name: "District Compliance Audit"
  short_description: "End-to-end compliance and health audit for any Rotary district in South Asia."
  brand_color: "#005596"
  default_prompt: "Audit compliance risks and club health for District [number]"

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "rotaract-insights"
      description: "Rotaract South Asia Analytics MCP server"
      transport: "streamable_http"
      url: "https://insights.rsamdio.org/api/mcp"
