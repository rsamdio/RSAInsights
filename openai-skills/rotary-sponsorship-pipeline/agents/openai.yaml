interface:
  display_name: "Rotary Sponsorship Pipeline"
  short_description: "Strategic sponsorship expansion plans for District Governors and District Rotaract Chairs."
  brand_color: "#005596"
  default_prompt: "Find Rotary clubs without Rotaract sponsorship in District [number]"

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "rotaract-insights"
      description: "Rotaract South Asia Analytics MCP server"
      transport: "streamable_http"
      url: "https://insights.rsamdio.org/api/mcp"
